[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qifflt"
version = "0.2.0"
description = "Qifflt: an intentionally unreadable programming language, hypertext markup language, and hypertext audio language, all sharing one alphabet. Sibling to Silem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TeamCode" }]
keywords = ["esolang", "interpreter", "programming-language", "markup", "audio", "qifflt", "silem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/teamcode/qifflt"
Repository = "https://github.com/teamcode/qifflt"

[project.scripts]
qifflt = "qifflt.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
highlight = ["pygments>=2.14"]

[project.entry-points."pygments.lexers"]
qifflt = "qifflt.pygments_lexer:QiffltLexer"

[tool.hatch.build.targets.wheel]
packages = ["src/qifflt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
