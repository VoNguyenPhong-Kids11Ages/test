name: Publish to PyPI

# Runs the test suite on every push/PR, and publishes to PyPI whenever a
# GitHub Release is published (or manually via workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project + dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v

  build:
    name: Build sdist & wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions with twine
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qifflt/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) — no API token needed
      # once the project is registered as a trusted publisher on PyPI.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing needs no `with:` block at all. If Trusted
        # Publishing isn't set up yet, uncomment the two lines below and
        # add a PYPI_API_TOKEN secret to the repo instead.
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
